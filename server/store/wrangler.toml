name = "onion-board-store"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "onion-board-store"
database_id = "db1ea851-8ee1-414c-8674-8be70a5b7f0c"

# the sounds' files (Workers KV: free, no payment card on the account)
[[kv_namespaces]]
binding = "FILES"
id = "30ae4ae2184e43b5833d37116a390286"

# once a day: drop action-log rows over 90 days old and old rate-limit counters;
# every 10 minutes: one page of Myinstants into the store as links (src/sync.js)
[triggers]
crons = ["17 3 * * *", "*/10 * * * *"]   # the daily clean-up; a site sync step

# list pages and files: 90 a minute per address (index.js throttle()), so no one loop can use
# up the free plan's daily reads (D1 rows, KV files) for everyone
[[ratelimits]]
name = "READS"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 90
  period = 60

# uploads, links, shares, votes and reports: 30 a minute per address, checked before any
# database read (index.js route()); /admin calls count as READS
[[ratelimits]]
name = "WRITES"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 30
  period = 60

# Secrets (never in this file): `npx wrangler secret put ADMIN_TOKEN`, `... SALT` and
# `... BLOCKED_WORDS` (words refused in shared names, tags and descriptions, comma-separated)
