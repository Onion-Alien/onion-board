[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "soundboard"
dynamic = ["version"]
description = "Gaming soundboard: mic + sounds + web search, mixed into a virtual mic"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-MIT-Commons-Clause"
license-files = ["LICENSE"]
keywords = ["soundboard", "discord", "virtual microphone", "voice changer", "gaming"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "PySide6==6.11.2",
    "numpy==2.5.3",
    "sounddevice==0.5.6",
    "soundfile==0.14.0",
    "soxr==1.1.0",
    "scipy==1.18.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.9", "pyinstaller==6.22.3"]

[project.urls]
Homepage = "https://github.com/Onion-Alien/onionboard"
Issues = "https://github.com/Onion-Alien/onionboard/issues"
Changelog = "https://github.com/Onion-Alien/onionboard/blob/main/CHANGELOG.md"

[project.gui-scripts]
soundboard = "soundboard.app:main"

[tool.setuptools.packages.find]
include = ["soundboard*"]

[tool.setuptools.dynamic]
version = { attr = "soundboard.__version__" }

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, B: bugbear, BLE: blind except, UP: modern syntax.
# Import sorting (I) is left out on purpose: it would explode every multi-name import
# into one-name-per-line blocks, which is not how this codebase is written.
select = ["E", "W", "F", "B", "BLE", "UP"]
ignore = [
    "E731",   # lambda assignment: used deliberately for tiny local helpers
    "B008",   # function call in default arg (Qt enums)
    "B905",   # zip(strict=): the zips here are over fixed-size parallel tuples
]

[tool.ruff.lint.per-file-ignores]
"soundboard/theme.py" = ["E501"]   # the stylesheet is one rule per line
"tests/*" = ["BLE"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
