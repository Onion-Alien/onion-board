name: ffmpeg-pin

# The app's FFmpeg backup download (soundboard/ffmpegget.py) is pinned to one zip on two
# sites. The builder's site removes old builds, so check weekly that both still serve it
# with the pinned SHA-256: a red run here means bump the pin before users hit it.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - soundboard/ffmpegget.py
      - scripts/check_ffmpeg_pin.py
      - .github/workflows/ffmpeg-pin.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python scripts/check_ffmpeg_pin.py
