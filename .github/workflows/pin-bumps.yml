name: pin-bumps

# Pinned downloads the app fetches itself (not pip packages or actions: Dependabot does
# those) are bumped here: one script per pin in scripts/pinbump/. Each finds the newest
# release, verifies it, smoke-tests it (unpacks and runs it: these are Windows programs,
# so the job runs on Windows), rewrites the pin and opens its own PR on
# pin-bump/<name>-<version>; a failed smoke test opens none. Nothing merges by itself.
# It skips a bump that's already waiting. One failing checker doesn't stop the others.
# FFmpeg's builder drops old builds, so when its pin is already the newest the ffmpeg job
# checks both its sites still serve the pinned zip: a red one there means bump by hand.
# yt-dlp is different: its job adds the newest release to pins/yt-dlp.json, the list the
# app's Update now reads from main (merging the PR approves it), after checking its PyPI
# attestations (scripts/pinbump/ytdlp.py).
on:
  schedule:
    - cron: "37 6 * * 1"   # Mondays 06:37 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/pinbump/**
      - .github/workflows/pin-bumps.yml
      - soundboard/online/torget.py      # a hand-edited pin gets checked too
      - soundboard/online/ffmpegget.py
      - soundboard/online/pyget.py
      - scripts/buildtools/fetch_qjs.py
      - pins/yt-dlp.json

permissions:
  contents: read

jobs:
  # `check` downloads and runs new upstream programs (the smoke tests), so its token can
  # only read and none is left in .git/config; it leaves each bump's edited pin and PR
  # text as an artifact. `open` has the write token and runs nothing downloaded: it
  # puts those pin files back (only files a checker may edit) and opens the PRs.
  check:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        checker: [tor, ffmpeg, qjs, python, ytdlp]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - if: matrix.checker == 'ytdlp'   # checks PyPI attestations (sigstore)
        run: python -m pip install -r scripts/pinbump/requirements.txt
      # On a PR touching the bumpers: check, verify and smoke-test only, change nothing.
      # Git Bash puts Git for Windows' gpg on PATH (tor.py checks a signature with it).
      - env:
          GH_TOKEN: ${{ github.token }}   # (read-only here: GitHub's API rate limit)
          PYTHONIOENCODING: utf-8
          PINBUMP_OUT: ${{ runner.temp }}/pinbump
          DRY_RUN: ${{ github.event_name == 'pull_request' && '--dry-run' || '' }}
        shell: bash
        run: python scripts/pinbump/${{ matrix.checker }}.py $DRY_RUN
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pinbump-${{ matrix.checker }}
          path: ${{ runner.temp }}/pinbump/
          if-no-files-found: ignore
          retention-days: 2

  open:
    needs: check
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # push pin-bump/* branches
      pull-requests: write   # open their PRs
      actions: write         # start checks.yml on them
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v7
        with:
          pattern: pinbump-*
          merge-multiple: true
          path: ${{ runner.temp }}/pinbump
      - env:
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
        run: python scripts/pinbump/open_pr.py "${{ runner.temp }}/pinbump"
