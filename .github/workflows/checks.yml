name: checks

on:
  # main takes changes by pull request only, so a branch is checked once, as its
  # PR (push + pull_request ran every PR twice); main is checked after each merge.
  push:
    branches: [main]
  pull_request:
  # Every night, the whole suite on main: a test that only passes on a rerun shows up
  # as a trend, and the flaky-trend job fails the night a new one appears.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      linux:
        description: Also run the Linux tests (off by default)
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same PR replaces its unfinished run. main's runs all finish.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # scan the whole history, not just the tip
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # What's new only: a PR, its commits not on main yet; main, what the push added
      # (each was scanned as its PR already). A manual run scans the whole history.
      - name: Commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          case "$EVENT" in
            pull_request) echo "range=origin/main..$PR_HEAD" >> "$GITHUB_OUTPUT" ;;
            push) echo "range=$BEFORE..$AFTER" >> "$GITHUB_OUTPUT" ;;
            *) echo "range=--all" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Personal data and secrets (repo rules)
        env:
          RANGE: ${{ steps.range.outputs.range }}
        # "=": a nightly run's range is --all, which on its own reads as an option
        run: python scripts/check_sensitive.py --history="$RANGE"
      # A commit's time zone says where its author is: new commits must be in UTC
      # (CLAUDE.md, "Commit times"). A PR: its commits not on main yet, and it fails.
      # main: what the push added (a merge made with GitHub's button or `gh pr merge`)
      # is only a warning: it's pushed already and can't be re-stamped, so a red main
      # would just stay red and notify everyone for nothing.
      - name: Commit times in UTC
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            sh scripts/check_utc.sh "$PR_HEAD" --not origin/main
          elif ! sh scripts/check_utc.sh "$BEFORE..$AFTER"; then
            echo "::warning::A merge on main isn't in UTC: merge with scripts/merge_pr.sh, not gh pr merge or the button"
          fi
      # The CLI rather than gitleaks-action: the action scans `<first commit>^..`,
      # which errors on a repo's first push (the root commit has no parent).
      - name: gitleaks (the same commits)
        env:
          GITLEAKS_VERSION: "8.30.1"
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar xzf "$tarball" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 --log-opts="$RANGE" .

  # ruff, and which test files this change needs (scripts/pick_tests.py): a PR runs
  # only the tests of what it changed, so a docs-only PR doesn't start Windows at all.
  # main (after each merge) and a manual run take the whole suite.
  pick:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.pick.outputs.tests }}
      matrix: ${{ steps.pick.outputs.matrix }}
      shards: ${{ steps.pick.outputs.shards }}
      shard_tests: ${{ steps.pick.outputs.shard_tests }}
      mic: ${{ steps.pick.outputs.mic }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # the PR's changes are a diff against main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="origin/$BASE"
          else
            base=all
          fi
          tests=$(python scripts/pick_tests.py "$base" | tr '\n' ' ')
          # the test jobs: a long run split in four (about the same length each)
          matrix=$(python scripts/pick_tests.py "$base" --matrix)
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          # the test jobs' matrix is just the shard names ("1/4"), each job's files
          # looked up by name: a job skipped before it starts never gets its matrix, and
          # a name built from matrix.shard showed up on it as raw expression text
          echo "shards=$(jq -c '[.[].shard]' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          echo "shard_tests=$(jq -c 'map({(.shard): .tests}) | add // {}' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          # the mic effect's own job: a PR that touches its C++ or what checks it;
          # main and a manual run always
          mic=true
          if [ "$EVENT" = pull_request ] && ! git diff --name-only "$base"...HEAD | grep -qE \
              '^(native/directmic/|scripts/(build|check|fuzz)_directmic\.py|tests/test_directmic\.py|soundboard/directmic\.py|\.github/workflows/checks\.yml)'; then
            mic=false
          fi
          echo "mic=$mic" >> "$GITHUB_OUTPUT"
          echo "Tests to run: ${tests:-none}"
          echo "Mic effect job: $mic"
          echo "Windows jobs: $matrix"
      - run: |
          python -m pip install -q "$(grep '^ruff==' requirements-dev.txt)"
          ruff check .
      # every text the app shows is in every catalog, none left over (CLAUDE.md)
      - name: Translations complete
        run: python scripts/i18n_extract.py --check
      - name: CODE.md lists every module
        run: python scripts/check_code_doc.py

  # pyright over the whole repo: errors not in scripts/pyright_baseline.json fail
  # (it's empty now, so any type error does). On Windows: Linux's PySide6 has no
  # Windows-only APIs (QImage.fromHICON), so pyright there flags code that's fine.
  # Same venv cache as the Windows test jobs.
  types:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.13"
      - uses: actions/cache@v6
        id: venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: .venv\Scripts\python scripts/check_types.py --all

  # The Windows tests, as the pick job split them: a long run (main, or a PR that needs
  # most of the suite) in four jobs side by side, about a quarter of the wait.
  windows:
    needs: pick
    if: ${{ needs.pick.result == 'success' && needs.pick.outputs.matrix != '[]' }}
    name: test-windows   # GitHub adds the shard: "test-windows (1/4)"
    strategy:
      fail-fast: false   # each job's failures are listed in full
      matrix:
        shard: ${{ fromJSON(needs.pick.outputs.shards) }}
    runs-on: windows-latest
    timeout-minutes: 20   # a hung test fails the run instead of holding it for hours
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.13"
      # The installed packages are kept between runs (installing them took ~90 s);
      # a change to either requirements file, or a new Python, starts a fresh venv.
      - uses: actions/cache@v6
        id: venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements.txt -r requirements-dev.txt
      # A test worker that dies outright ("worker 'gw0' crashed", no traceback: a heap
      # corruption fast-fail is past faulthandler) leaves a Windows crash dump here,
      # uploaded below, so the native stack of the crash can be read.
      - name: Keep crash dumps
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value "$env:RUNNER_TEMP\crashdumps" -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -Value 5 -PropertyType DWord -Force | Out-Null
      # --durations: the slowest tests are listed at the end of every run, so one that
      # got slow (or hangs: pyproject's faulthandler_timeout stops it) shows up there.
      # --reruns 2: a failed test gets two more tries, a crashed worker's test too
      # (pytest-rerunfailures), so a flake doesn't hold up a merge; a real break fails
      # all three. The tests that needed a rerun are listed on the run's summary page.
      # TESTS: this job's share of the files the pick job chose. junit.xml: each test's
      # time, kept to split the next runs evenly (pick_tests.py --refresh-times).
      - shell: bash
        run: |
          set -o pipefail
          .venv/Scripts/python -m pytest --durations=20 --reruns 2 -rfER --junitxml=junit.xml $TESTS | tee pytest.log
        env:
          QT_QPA_PLATFORM: offscreen
          TESTS: ${{ fromJSON(needs.pick.outputs.shard_tests)[matrix.shard] }}
      - name: Flaky tests (passed on a rerun)
        if: always()
        shell: bash
        run: |
          flaky=$(grep -a '^RERUN ' pytest.log 2>/dev/null | sort -u || true)
          if [ -n "$flaky" ]; then
            { echo "### Needed a rerun (flaky: fix when there's time)"; echo '```'
              echo "$flaky"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "$flaky" | sed 's/^/::warning::/'
          fi
          # the test ids alone, for the nightly's flaky-trend job
          echo "$flaky" | awk 'NF { print $2 }' > flaky.txt
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: times-${{ strategy.job-index }}
          path: junit.xml
          if-no-files-found: ignore
          retention-days: 14
      - if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: flaky-${{ strategy.job-index }}
          path: flaky.txt
          if-no-files-found: ignore
          retention-days: 2
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crashdumps-${{ strategy.job-index }}
          path: ${{ runner.temp }}/crashdumps
          if-no-files-found: ignore
          retention-days: 14

  # The mic effect (native/directmic/, the C++ Windows' audio engine runs): the test
  # jobs skip its end-to-end tests, which need the effect and its test hosts built.
  # Here they're built with the runner's MinGW, checked (scripts/check_directmic.py:
  # warnings as errors, GCC's analyzer, cppcheck), run (tests/test_directmic.py), and
  # fuzzed for a minute. Only when the pick job says the change touches it.
  mic-effect:
    needs: pick
    if: ${{ needs.pick.result == 'success' && needs.pick.outputs.mic == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.13"
      - uses: actions/cache@v6
        id: venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements.txt -r requirements-dev.txt
      # the image's MinGW-w64 (C:\mingw64), not another g++ that may be on PATH first
      - name: Compiler
        shell: pwsh
        run: |
          $gxx = 'C:\mingw64\bin\g++.exe'
          if (-not (Test-Path $gxx)) { $gxx = (Get-Command g++ -ErrorAction Stop).Source }
          & $gxx --version | Select-Object -First 1
          "MINGW_GXX=$gxx" >> $env:GITHUB_ENV
      # straight from cppcheck's GitHub release: Chocolatey's feed times out now and
      # then, and the copy beside the image's g++ can't find its own std.cfg
      - name: cppcheck
        shell: pwsh
        run: |
          $v = '2.19.0'
          $msi = "$env:RUNNER_TEMP\cppcheck.msi"
          gh release download $v -R danmar/cppcheck -p "cppcheck-$v-x64-Setup.msi" -O $msi --clobber
          Start-Process msiexec -ArgumentList '/i', $msi, '/qn', '/norestart' -Wait -NoNewWindow
          & 'C:\Program Files\Cppcheck\cppcheck.exe' --version
          if ($LASTEXITCODE) { exit 1 }
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check the C++
        run: .venv\Scripts\python scripts/check_directmic.py --need-cppcheck
      - name: Build
        run: .venv\Scripts\python scripts/build_directmic.py --testhost --fuzz
      - name: Tests (the real effect in the test host)
        env:
          QT_QPA_PLATFORM: offscreen
        # -n 4: one file runs in one process by default (conftest), ~5 min for this one.
        # The ones in the test host run alone after: side by side they miss real time.
        run: |
          .venv\Scripts\python -m pytest -n 4 -m "not host" --durations=10 --reruns 2 -rfER tests/test_directmic.py
          if ($LASTEXITCODE) { exit 1 }
          .venv\Scripts\python -m pytest -n 0 -m host --durations=10 --reruns 2 -rfER tests/test_directmic.py
      - name: Fuzz (60 s)
        run: .venv\Scripts\python scripts/fuzz_directmic.py 60 2

  # The nightly's flaky tests (passed on a rerun) against the last nightly's: a new one
  # fails this job, so a flake shows up the night it starts instead of hiding behind
  # --reruns. The list it saves (flaky-all) is what the next night compares with.
  flaky-trend:
    needs: windows
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read   # the last nightly's list
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: flaky-*
          path: shards
      - name: The last nightly's list
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          touch before.txt
          last=$(gh run list -R "$REPO" --workflow checks.yml --event schedule \
            --status completed --limit 10 --json databaseId \
            -q "[.[] | select(.databaseId != $RUN)][0].databaseId // empty")
          if [ -n "$last" ] && gh run download "$last" -R "$REPO" -n flaky-all -D last; then
            cp last/flaky.txt before.txt
          else
            echo "No list from a last nightly: tonight's is the first."
          fi
      - name: New flaky tests
        run: |
          cat shards/*/flaky.txt 2>/dev/null | sort -u > flaky.txt || true
          sort -u before.txt > before.sorted
          new=$(comm -13 before.sorted flaky.txt)
          gone=$(comm -23 before.sorted flaky.txt)
          { echo "### Flaky tests tonight: $(wc -l < flaky.txt) (last night: $(wc -l < before.sorted))"
            if [ -n "$new" ]; then echo "New:"; echo '```'; echo "$new"; echo '```'; fi
            if [ -n "$gone" ]; then echo "No longer flaky:"; echo '```'; echo "$gone"; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$new" ]; then
            echo "$new" | sed 's/^/::error::New flaky test: /'
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-all
          path: flaky.txt
          retention-days: 30

  # One check named `test` whatever the split: passed when every Windows job did, or
  # when the change needs no tests; failed when ruff, the pick or the type check did,
  # so it can't pass over a lint or type error.
  test:
    needs: [pick, windows, types, mic-effect]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          PICK: ${{ needs.pick.result }}
          WINDOWS: ${{ needs.windows.result }}
          TYPES: ${{ needs.types.result }}
          MIC: ${{ needs.mic-effect.result }}
          MATRIX: ${{ needs.pick.outputs.matrix }}
        run: |
          echo "pick: $PICK, types: $TYPES, mic effect: $MIC, Windows jobs: $WINDOWS ($MATRIX)"
          if [ "$PICK" != success ]; then
            echo "ruff or the test pick failed: see the pick job"; exit 1
          fi
          if [ "$TYPES" != success ]; then
            echo "new type errors: see the types job (scripts/check_types.py)"; exit 1
          fi
          if [ "$MIC" != success ] && [ "$MIC" != skipped ]; then
            echo "the mic effect's checks failed: see the mic-effect job"; exit 1
          fi
          if [ "$MATRIX" != "[]" ] && [ "$WINDOWS" != success ]; then
            echo "a Windows test job didn't pass"; exit 1
          fi

  # The same suite on Linux, for people working on the code away from Windows: the
  # tests marked `windows` are skipped and Windows itself is stood in for
  # (tests/offwindows.py), so this run proves the Linux mode still works.
  # Split as the Windows jobs are (the whole suite in one job took ~6 min).
  # Off unless asked for: the code is worked on from Windows, so it only runs by hand
  # (Actions > checks > Run workflow, tick "Also run the Linux tests", or
  # `gh workflow run checks.yml -f linux=true`). It never gated a merge.
  test-linux:
    needs: pick
    if: ${{ inputs.linux && needs.pick.result == 'success' && needs.pick.outputs.matrix != '[]' }}
    name: test-linux   # GitHub adds the shard: "test-linux (1/4)"
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.pick.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.13"
      # PortAudio and libsndfile for sounddevice / soundfile; the rest is what Qt's
      # offscreen platform loads
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 libsndfile1 \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libpulse0 libx11-xcb1 libxrandr2
      - uses: actions/cache@v6
        id: venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: |
          set -o pipefail
          .venv/bin/python -m pytest --durations=20 --reruns 2 -rfER $TESTS | tee pytest.log
        env:
          QT_QPA_PLATFORM: offscreen
          TESTS: ${{ fromJSON(needs.pick.outputs.shard_tests)[matrix.shard] }}
      - name: Flaky tests (passed on a rerun)
        if: always()
        shell: bash
        run: |
          flaky=$(grep -a '^RERUN ' pytest.log 2>/dev/null | sort -u || true)
          if [ -n "$flaky" ]; then
            { echo "### Needed a rerun (flaky: fix when there's time)"; echo '```'
              echo "$flaky"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "$flaky" | sed 's/^/::warning::/'
          fi
