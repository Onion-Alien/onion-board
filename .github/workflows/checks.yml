name: checks

on:
  # main takes changes by pull request only, so a branch is checked once, as its
  # PR (push + pull_request ran every PR twice); main is checked after each merge.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR replaces its unfinished run. main's runs all finish.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # scan the whole history, not just the tip
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # What's new only: a PR, its commits not on main yet; main, what the push added
      # (each was scanned as its PR already). A manual run scans the whole history.
      - name: Commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          case "$EVENT" in
            pull_request) echo "range=origin/main..$PR_HEAD" >> "$GITHUB_OUTPUT" ;;
            push) echo "range=$BEFORE..$AFTER" >> "$GITHUB_OUTPUT" ;;
            *) echo "range=--all" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Personal data and secrets (repo rules)
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: python scripts/check_sensitive.py --history "$RANGE"
      # A commit's time zone says where its author is: new commits must be in UTC
      # (CLAUDE.md, "Commit times"). A PR: its commits not on main yet, and it fails.
      # main: what the push added (a merge made with GitHub's button or `gh pr merge`)
      # is only a warning: it's pushed already and can't be re-stamped, so a red main
      # would just stay red and notify everyone for nothing.
      - name: Commit times in UTC
        if: github.event_name != 'workflow_dispatch'
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            sh scripts/check_utc.sh "$PR_HEAD" --not origin/main
          elif ! sh scripts/check_utc.sh "$BEFORE..$AFTER"; then
            echo "::warning::A merge on main isn't in UTC: merge with scripts/merge_pr.sh, not gh pr merge or the button"
          fi
      # The CLI rather than gitleaks-action: the action scans `<first commit>^..`,
      # which errors on a repo's first push (the root commit has no parent).
      - name: gitleaks (the same commits)
        env:
          GITLEAKS_VERSION: "8.30.1"
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar xzf "$tarball" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 --log-opts="$RANGE" .

  # ruff, and which test files this change needs (scripts/pick_tests.py): a PR runs
  # only the tests of what it changed, so a docs-only PR doesn't start Windows at all.
  # main (after each merge) and a manual run take the whole suite.
  pick:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.pick.outputs.tests }}
      matrix: ${{ steps.pick.outputs.matrix }}
      shards: ${{ steps.pick.outputs.shards }}
      shard_tests: ${{ steps.pick.outputs.shard_tests }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # the PR's changes are a diff against main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="origin/$BASE"
          else
            base=all
          fi
          tests=$(python scripts/pick_tests.py "$base" | tr '\n' ' ')
          # the test jobs: a long run split in four (about the same length each)
          matrix=$(python scripts/pick_tests.py "$base" --matrix)
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          # the test jobs' matrix is just the shard names ("1/4"), each job's files
          # looked up by name: a job skipped before it starts never gets its matrix, and
          # a name built from matrix.shard showed up on it as raw expression text
          echo "shards=$(jq -c '[.[].shard]' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          echo "shard_tests=$(jq -c 'map({(.shard): .tests}) | add // {}' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          echo "Tests to run: ${tests:-none}"
          echo "Windows jobs: $matrix"
      - run: |
          python -m pip install -q "$(grep '^ruff==' requirements-dev.txt)"
          ruff check .
      # every text the app shows is in every catalog, none left over (CLAUDE.md)
      - name: Translations complete
        run: python scripts/i18n_extract.py --check
      - name: CODE.md lists every module
        run: python scripts/check_code_doc.py

  # pyright over the whole repo: errors not in scripts/pyright_baseline.json fail
  # (it's empty now, so any type error does). On Windows: Linux's PySide6 has no
  # Windows-only APIs (QImage.fromHICON), so pyright there flags code that's fine.
  # Same venv cache as the Windows test jobs.
  types:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.13"
      - uses: actions/cache@v6
        id: venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: .venv\Scripts\python scripts/check_types.py --all

  # The Windows tests, as the pick job split them: a long run (main, or a PR that needs
  # most of the suite) in four jobs side by side, about a quarter of the wait.
  windows:
    needs: pick
    if: ${{ needs.pick.result == 'success' && needs.pick.outputs.matrix != '[]' }}
    name: test-windows   # GitHub adds the shard: "test-windows (1/4)"
    strategy:
      fail-fast: false   # each job's failures are listed in full
      matrix:
        shard: ${{ fromJSON(needs.pick.outputs.shards) }}
    runs-on: windows-latest
    timeout-minutes: 20   # a hung test fails the run instead of holding it for hours
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.13"
      # The installed packages are kept between runs (installing them took ~90 s);
      # a change to either requirements file, or a new Python, starts a fresh venv.
      - uses: actions/cache@v6
        id: venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements.txt -r requirements-dev.txt
      # A test worker that dies outright ("worker 'gw0' crashed", no traceback: a heap
      # corruption fast-fail is past faulthandler) leaves a Windows crash dump here,
      # uploaded below, so the native stack of the crash can be read.
      - name: Keep crash dumps
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value "$env:RUNNER_TEMP\crashdumps" -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -Value 5 -PropertyType DWord -Force | Out-Null
      # --durations: the slowest tests are listed at the end of every run, so one that
      # got slow (or hangs: pyproject's faulthandler_timeout stops it) shows up there.
      # --reruns 2: a failed test gets two more tries, a crashed worker's test too
      # (pytest-rerunfailures), so a flake doesn't hold up a merge; a real break fails
      # all three. The tests that needed a rerun are listed on the run's summary page.
      # TESTS: this job's share of the files the pick job chose.
      - shell: bash
        run: |
          set -o pipefail
          .venv/Scripts/python -m pytest --durations=20 --reruns 2 -rfER $TESTS | tee pytest.log
        env:
          QT_QPA_PLATFORM: offscreen
          TESTS: ${{ fromJSON(needs.pick.outputs.shard_tests)[matrix.shard] }}
      - name: Flaky tests (passed on a rerun)
        if: always()
        shell: bash
        run: |
          flaky=$(grep -a '^RERUN ' pytest.log 2>/dev/null | sort -u || true)
          if [ -n "$flaky" ]; then
            { echo "### Needed a rerun (flaky: fix when there's time)"; echo '```'
              echo "$flaky"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "$flaky" | sed 's/^/::warning::/'
          fi
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crashdumps-${{ strategy.job-index }}
          path: ${{ runner.temp }}/crashdumps
          if-no-files-found: ignore
          retention-days: 14

  # One check named `test` whatever the split: passed when every Windows job did, or
  # when the change needs no tests; failed when ruff, the pick or the type check did,
  # so it can't pass over a lint or type error.
  test:
    needs: [pick, windows, types]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          PICK: ${{ needs.pick.result }}
          WINDOWS: ${{ needs.windows.result }}
          TYPES: ${{ needs.types.result }}
          MATRIX: ${{ needs.pick.outputs.matrix }}
        run: |
          echo "pick: $PICK, types: $TYPES, Windows jobs: $WINDOWS ($MATRIX)"
          if [ "$PICK" != success ]; then
            echo "ruff or the test pick failed: see the pick job"; exit 1
          fi
          if [ "$TYPES" != success ]; then
            echo "new type errors: see the types job (scripts/check_types.py)"; exit 1
          fi
          if [ "$MATRIX" != "[]" ] && [ "$WINDOWS" != success ]; then
            echo "a Windows test job didn't pass"; exit 1
          fi

  # The same suite on Linux, for people working on the code away from Windows: the
  # tests marked `windows` are skipped and Windows itself is stood in for
  # (tests/offwindows.py), so this run proves the Linux mode still works.
  # Split as the Windows jobs are (the whole suite in one job took ~6 min).
  # Only on main (after each merge) and by hand: on every PR it doubled the runners a
  # PR took, and with a few PRs at once they queued for minutes. It never gated a merge.
  test-linux:
    needs: pick
    if: ${{ github.event_name != 'pull_request' && needs.pick.result == 'success' && needs.pick.outputs.matrix != '[]' }}
    name: test-linux   # GitHub adds the shard: "test-linux (1/4)"
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.pick.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.13"
      # PortAudio and libsndfile for sounddevice / soundfile; the rest is what Qt's
      # offscreen platform loads
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 libsndfile1 \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libpulse0 libx11-xcb1 libxrandr2
      - uses: actions/cache@v6
        id: venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: |
          set -o pipefail
          .venv/bin/python -m pytest --durations=20 --reruns 2 -rfER $TESTS | tee pytest.log
        env:
          QT_QPA_PLATFORM: offscreen
          TESTS: ${{ fromJSON(needs.pick.outputs.shard_tests)[matrix.shard] }}
      - name: Flaky tests (passed on a rerun)
        if: always()
        shell: bash
        run: |
          flaky=$(grep -a '^RERUN ' pytest.log 2>/dev/null | sort -u || true)
          if [ -n "$flaky" ]; then
            { echo "### Needed a rerun (flaky: fix when there's time)"; echo '```'
              echo "$flaky"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "$flaky" | sed 's/^/::warning::/'
          fi
