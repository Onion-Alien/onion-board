name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scan the whole history, not just the tip
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Personal data and secrets (repo rules)
        run: python scripts/check_sensitive.py --history
      # The CLI rather than gitleaks-action: the action scans `<first commit>^..`,
      # which errors on a repo's first push (the root commit has no parent).
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar xzf "$tarball" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
