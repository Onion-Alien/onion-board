name: website

# The website's main address is onionalien.com/onionboard (its pages' canonical
# links say so). The old address, onion-alien.github.io/onion-board, carries the
# same site so old links still work, downloads included (GitHub's latest
# release). A page that doesn't exist there forwards to onionalien.com. Runs
# after each merge that changes site/ (the repo's Pages source is "GitHub Actions").
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer one waits instead of cutting the running one off.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Copy the site, plus a 404 that forwards to onionalien.com
        run: |
          cp -r site out
          new=https://onionalien.com/onionboard/
          cat > out/404.html <<EOF
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <title>Onion Board</title>
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=$new">
          <script>location.replace(/^#watch/.test(location.hash) ? "https://onionalien.com/onionwatch/" : "$new");</script>
          </head><body><p>Onion Board's website: <a href="$new">$new</a>.</p></body></html>
          EOF
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v5
