name: website

# The website lives at onionalien.com/onionboard now. The old address,
# onion-alien.github.io/onion-board, keeps every page as a stub that forwards to
# the same page there (and #watch to /onionwatch/), so old links and search
# results still land. Runs after each merge that changes site/ (the repo's
# Pages source is "GitHub Actions").
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer one waits instead of cutting the running one off.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Build the forwarding stubs
        run: |
          mkdir -p out
          stub() {  # $1 = page path under the site ("" for the home page)
            new="https://onionalien.com/onionboard/$1"
            cat <<EOF
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <title>Onion Board has moved</title>
          <link rel="canonical" href="$new">
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=$new">
          <script>location.replace(/^#watch/.test(location.hash) ? "https://onionalien.com/onionwatch/" : "$new" + location.search + location.hash);</script>
          </head><body><p>Onion Board's website moved to <a href="$new">$new</a>.</p></body></html>
          EOF
          }
          (cd site && find . -name index.html) | while read -r f; do
            dir=$(dirname "${f#./}"); [ "$dir" = "." ] && dir="" || dir="$dir/"
            mkdir -p "out/$dir"; stub "$dir" > "out/${dir}index.html"
          done
          stub "" > out/404.html
          # Keep the search engines' ownership files, so the old property can still be used to move.
          cp site/google*.html site/*.txt out/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v5
